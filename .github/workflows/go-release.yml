name: Go release artifacts

# Manual only. This workflow never creates a git tag or a GitHub release; the artifacts are attached to this
# workflow run. With publish_image it also pushes a multi-arch container image to GHCR under a name of its own
# (ghcr.io/<owner>/classycash:<version>, never ":latest"), distinct from the legacy PHP image
# (ghcr.io/<owner>/app). The legacy tag-triggered deploy is disabled (see docs/INTEGRATION.md, "Release artifacts").
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version YYYYMMDDHHMM (UTC build time). Empty = now. No tag is created.'
        required: false
        default: ''
        type: string
      publish_image:
        description: 'Also build and push ghcr.io/<owner>/classycash:<version> (linux/amd64, linux/arm64)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests
        run: go test -race -count=1 ./...
      - name: build artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [ -n "$VERSION" ] || VERSION=$(date -u +%Y%m%d%H%M)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION=$VERSION sh scripts/release.sh
      - name: verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: classycash-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
      - uses: docker/setup-qemu-action@v3
        if: ${{ inputs.publish_image }}
      - uses: docker/setup-buildx-action@v3
        if: ${{ inputs.publish_image }}
      - uses: docker/login-action@v3
        if: ${{ inputs.publish_image }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image name
        if: ${{ inputs.publish_image }}
        run: echo "IMAGE=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/classycash" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v5
        if: ${{ inputs.publish_image }}
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
