name: Go release artifacts

# Manual only. This workflow never creates a git tag or a GitHub release: the legacy PHP workflow
# "Production Build and Deploy" runs on EVERY pushed tag, so tagging is a deliberate, separate step
# (see docs/INTEGRATION.md, "Release artifacts"). The artifacts are attached to this workflow run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version YYYYMMDDHHMM (UTC build time). Empty = now. No tag is created.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: tests
        run: go test -race -count=1 ./...
      - name: build artifacts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [ -n "$VERSION" ] || VERSION=$(date -u +%Y%m%d%H%M)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          VERSION=$VERSION sh scripts/release.sh
      - name: verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: classycash-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
