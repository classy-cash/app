name: Legacy PHP Production Build and Deploy (manual only)

# DISABLED FOR TAGS. This workflow used to run on EVERY pushed tag. The application is now the Go rewrite
# (cmd/classycash, deploy/Dockerfile); a tag must never rebuild the old PHP image and redeploy it over the
# production host with the shared hostname and secrets. It now runs only when a person starts it by hand AND
# types the confirmation phrase, and it is kept only so the old stack can be redeployed deliberately.
# Releases of the Go app: .github/workflows/go-release.yml and docs/INTEGRATION.md ("Release artifacts").
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-legacy-php" to build the OLD PHP app and deploy it over production'
        required: true
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    if: ${{ inputs.confirm == 'deploy-legacy-php' }}
    environment: production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/php/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache,mode=max
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_REVISION=${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Used to depend on a checkout of the private mleczakm/infrastructure-mikrus repo for
      # these two files (nothing else - it has no ansible/roles for this app to use). The
      # default GITHUB_TOKEN can never read another private repo, so that checkout has 404'd
      # since 2026-09-16 and every deploy since has failed before touching the container -
      # vendored here instead so this pipeline has no cross-repo dependency.
      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          pip install -r requirements.txt
          ansible-galaxy install -r ansible-collections-requirements.yml

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Create .env file
        run: |
          echo "${{ secrets.DOTENV }}" > .env.production
          echo "ENV_FILE_PATH=$(pwd)/.env.production" >> "$GITHUB_ENV"

      - name: Deploy to Mikrus
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbooks/deploy.yml \
            --extra-vars "app_version=${{ github.ref_name }} cytrus_host=${{ secrets.CYTRUS_IPV4 }}" \
            --extra-vars "cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --extra-vars "cloudflare_zone_id=${{ secrets.CLOUDFLARE_ZONE_ID }}" \
            --extra-vars "cytrus_api_token=${{ secrets.CYTRUS_API_TOKEN }}" \
            --extra-vars "ansible_host=${{ secrets.MIKRUS_SSH_HOST }} mikrus_ipv6=${{ secrets.MIKRUS_IPV6 }}" \
            --extra-vars "ansible_port=${{ secrets.MIKRUS_SSH_PORT }}" \
            --extra-vars "github_actor=${{ github.actor }} github_token=${{ secrets.GITHUB_TOKEN }}" \
            --extra-vars "env_file_path=${{ env.ENV_FILE_PATH }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
          ANSIBLE_ROLES_PATH: ./ansible/roles
