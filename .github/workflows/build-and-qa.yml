name: Build and QA

# Legacy PHP quality gate. It only runs for pull requests that touch the PHP application, never on a push, and
# it no longer creates releases/tags or pushes branches: a tag used to trigger the production deploy, and the
# Go rewrite lives on main with its own pipeline (go-ci.yml).
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'templates/**'
      - 'translations/**'
      - 'composer.*'
      - '.docker/**'
      - 'phpunit.xml.dist'
      - '.github/workflows/build-and-qa.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:latest -color

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo -v --redact

  build-and-qa:
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: "!ChangeMe!"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long

      # Build and cache development image
      - name: Build and cache development image
        id: build-dev
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .docker/php/Dockerfile
          target: dev
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-cache
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}/{1}:dev-cache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
          load: true

      # Run Composer Static Analysis script against the development image
      - name: Run Composer SA
        run: docker run --rm ${{ steps.meta.outputs.tags }} composer sa


      - name: Get GitHub Actions Docker network name
        id: network
        run: |
            echo "NETWORK_NAME=$(docker network ls --filter name=github --format '{{.Name}}')" >> "$GITHUB_ENV"

      - name: Run unit and functional tests with coverage
        run: |
          mkdir -p target/coverage
          docker run --rm \
            --network "$NETWORK_NAME" \
            -e XDEBUG_MODE=coverage \
            -e DATABASE_URL \
            -v "$PWD/target/coverage:/app/target/coverage" \
            ${{ steps.meta.outputs.tags }} \
            sh -lc 'composer tests:functional:setup && bin/phpunit --group unit --group functional \
              --coverage-clover target/coverage/clover.xml \
              --coverage-cobertura target/coverage/cobertura.xml \
              --coverage-html target/coverage/html'
        env:
          DATABASE_URL: "postgresql://app:!ChangeMe!@db:5432/app_test?serverVersion=15&charset=utf8"

      - name: Publish coverage summary and badge
        id: coverage
        run: php .github/scripts/coverage-summary.php target/coverage/clover.xml docs/coverage.svg

      - name: Enforce coverage on changed code
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --disable-pip-version-check diff-cover
          diff-cover target/coverage/cobertura.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=50

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: target/coverage
          if-no-files-found: error
