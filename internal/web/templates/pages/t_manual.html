{{define "content"}}
<header class="page-head"><div><h1 class="serif">Kasa ręczna</h1><p class="muted">Zaksięguj gotówkę od rodzica lub wpisz wydatek z kasy klasowej.</p></div></header>
<div class="grid-2">
<section class="card" aria-labelledby="inc-h">
  <h2 id="inc-h" class="h3">Wpłata (gotówka)</h2>
  <form method="post" action="/treasurer/manual-transactions" class="stack" data-preview="income">
    {{template "csrf" .CSRF}}<input type="hidden" name="transaction_type" value="income">
    <div class="field"><label class="label" for="inc-amount">Kwota (PLN)</label><input class="input" id="inc-amount" name="amount_pln" inputmode="decimal" placeholder="50,00" required></div>
    <div class="field"><label class="label" for="inc-sp">Przypisz do ucznia / składki</label>
    <select class="input" id="inc-sp" name="student_payment_id"><option value="">Brak (wpłata ogólna)</option>{{range .Data.Open}}<option value="{{.ID}}" data-amount="{{plain .AmountMinor}}">{{.StudentName}} ({{.Label}}) — {{money .AmountMinor}}</option>{{end}}</select></div>
    <p class="consequence" aria-live="polite" data-consequence>Wpłata trafi do kasy klasy jako przychód ogólny.</p>
    <button class="btn btn-primary" type="submit">Zaksięguj przychód</button>
  </form>
</section>
<section class="card" aria-labelledby="exp-h">
  <h2 id="exp-h" class="h3">Koszty / wypłata</h2>
  <form method="post" action="/treasurer/manual-transactions" class="stack">
    {{template "csrf" .CSRF}}<input type="hidden" name="transaction_type" value="expense">
    <div class="field"><label class="label" for="exp-amount">Kwota wydana (PLN)</label><input class="input" id="exp-amount" name="amount_pln" inputmode="decimal" placeholder="25,00" required></div>
    <div class="field"><label class="label" for="exp-desc">Opis / przeznaczenie</label><input class="input" id="exp-desc" name="expense_description" maxlength="255" placeholder="np. Kwiaty na Dzień Nauczyciela" required></div>
    <p class="consequence">Wydatek zmniejszy saldo kasy klasy.</p>
    <button class="btn btn-primary" type="submit">Zaksięguj wydatek</button>
  </form>
</section>
</div>
{{end}}
